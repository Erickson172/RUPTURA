        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

            --gold-gradient:
                linear-gradient(
                    135deg,
                    #F8D308 0%,
                    #D4AF37 50%,
                    #F8D308 100%
                );

        }


        /* =========================================
           TÍTULO
        ========================================= */

        .titulo-topo {

            width: 100%;
            text-align: center;

            padding:
                18px 15px
                15px;

        }


        .titulo-topo h2 {

            color: #dc2626;

            font-size:
                clamp(20px, 2.5vw, 42px);

            font-weight: 900;

            font-style: italic;

            text-transform: uppercase;

        }


        /* =========================================
           CONTAINER PRINCIPAL
        ========================================= */

        .live-container {

            width: 100%;

            display: flex;

            justify-content: center;

            padding: 0 12px;

        }


        .live-wrapper {

            width: 100%;

            max-width: 1450px;

        }


        /* =========================================
           PARTE SUPERIOR
        ========================================= */

        .live-top {

            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding:
                8px 5px
                10px;

            gap: 15px;

        }


        .top-left {

            display: flex;

            align-items: center;

            gap: 9px;

            min-width: 0;

        }


        .avatar-principal {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            overflow: hidden;

            border:
                2px solid
                rgba(255,255,255,.9);

            background: #000;

            flex-shrink: 0;

        }


        .avatar-principal img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

        }


        .profile-info {

            display: flex;

            flex-direction: column;

            gap: 2px;

        }


        .profile-name {

            font-size:
                clamp(11px, 1.2vw, 17px);

            font-weight: 800;

        }


        .profile-likes {

            color: #cfcfcf;

            font-size:
                clamp(8px, .9vw, 13px);

        }


        .follow-btn {

            background: #ff174f;

            border: none;

            color: #fff;

            padding:
                7px 13px;

            border-radius: 30px;

            font-size:
                clamp(9px, .9vw, 13px);

            font-weight: 800;

            cursor: pointer;

            transition: .2s;

        }


        .follow-btn:hover {

            transform: scale(1.05);

        }


        .follow-btn.following {

            background: #333;

            color: #ddd;

        }


        /* =========================================
           TOPO DIREITO
        ========================================= */

        .top-right {

            display: flex;

            align-items: center;

            gap: 9px;

            flex-shrink: 0;

        }


        .avatars-live {

            display: flex;

            align-items: center;

        }


        .mini-avatar {

            width: 30px;

            height: 30px;

            border-radius: 50%;

            margin-left: -7px;

            border: 2px solid #eab308;

            overflow: hidden;

            background: #222;

        }


        .mini-avatar:first-child {

            margin-left: 0;

        }


        .mini-avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .viewer-count {

            font-size:
                clamp(10px, 1vw, 15px);

            font-weight: 700;

            white-space: nowrap;

        }


        .close-live {

            font-size:
                clamp(22px, 2vw, 32px);

            font-weight: 300;

            cursor: pointer;

        }


        /* =========================================
           ÁREA DO VÍDEO
        ========================================= */

        .video-stage {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            overflow: hidden;

            border-radius: 16px;

            box-shadow:

                0 0 0 1px
                rgba(255,255,255,.08),

                0 15px 50px
                rgba(0,0,0,.9);

        }


        .video-background {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            z-index: 1;

        }


        .video-background iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;

        }


        /* =========================================
           SOMBRAS DO VÍDEO
        ========================================= */

        .video-stage::before {

            content: "";

            position: absolute;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                linear-gradient(
                    180deg,
                    rgba(0,0,0,.30),
                    transparent 20%
                ),

                linear-gradient(
                    0deg,
                    rgba(0,0,0,.55),
                    transparent 25%
                );

        }


        /* =========================================
           RANKING
        ========================================= */

        .ranking {

            position: absolute;

            top: 12px;

            left: 12px;

            z-index: 5;

            background:
                rgba(0,0,0,.60);

            backdrop-filter:
                blur(10px);

            padding:
                6px 11px;

            border-radius: 30px;

            font-size:
                clamp(8px, .9vw, 13px);

            font-weight: 700;

        }


        /* =========================================
           EXPLORAR
        ========================================= */

        .explore {

            position: absolute;

            top: 12px;

            right: 12px;

            z-index: 5;

            background:
                rgba(0,0,0,.60);

            backdrop-filter:
                blur(10px);

            padding:
                6px 11px;

            border-radius: 30px;

            font-size:
                clamp(8px, .9vw, 13px);

            font-weight: 700;

        }


        /* =========================================
           BADGE LIVE
        ========================================= */

        .live-badge {

            position: absolute;

            top: 50px;

            right: 12px;

            z-index: 5;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                8px 10px;

            background:
                rgba(8,8,12,.85);

            backdrop-filter:
                blur(10px);

            border-radius: 10px;

        }


        .live-text {

            display: flex;

            flex-direction: column;

            gap: 1px;

        }


        .live-text strong {

            font-size:
                clamp(9px, 1vw, 14px);

        }


        .live-text span {

            font-size:
                clamp(7px, .8vw, 11px);

            color: #ddd;

        }


        .tiktok-symbol {

            font-size:
                clamp(18px, 2vw, 30px);

        }


        /* =========================================
           COMENTÁRIOS
        ========================================= */

        .comments {

            position: absolute;

            z-index: 6;

            left: 12px;

            bottom: 18px;

            width: 28%;

            display: flex;

            flex-direction: column;

            gap: 5px;

            pointer-events: none;

        }


        .comment {

            display: flex;

            align-items: flex-start;

            gap: 6px;

            opacity: 0;

            transform:
                translateY(10px);

            animation:
                commentAppear
                .4s ease forwards;

        }


        .comment-avatar {

            min-width: 26px;

            width: 26px;

            height: 26px;

            border-radius: 50%;

            overflow: hidden;

            background: #333;

            border:
                1px solid
                rgba(255,255,255,.4);

            flex-shrink: 0;

        }


        .comment-avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        .comment-body {

            display: flex;

            flex-direction: column;

            gap: 1px;

            max-width: 100%;

        }


        .comment-name {

            color: #d0d0d0;

            font-size:
                clamp(7px, .75vw, 11px);

            font-weight: 700;

        }


        .comment-message {

            color: #fff;

            font-size:
                clamp(8px, .85vw, 13px);

            font-weight: 500;

            line-height: 1.15;

            text-shadow:
                0 1px 4px
                rgba(0,0,0,.9);

        }


        @keyframes commentAppear {

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .comment.removing {

            animation:
                commentRemove
                .3s ease forwards;

        }


        @keyframes commentRemove {

            to {

                opacity: 0;

                transform:
                    translateX(-20px);

            }

        }


        /* =========================================
           CORAÇÕES
        ========================================= */

        .hearts-container {

            position: absolute;

            z-index: 6;

            right: 10px;

            bottom: 12px;

            width: 55px;

            height: 70%;

            overflow: hidden;

            pointer-events: none;

        }


        .heart {

            position: absolute;

            bottom: 0;

            font-size:
                clamp(18px, 2vw, 35px);

            animation:
                heartFloat
                3.5s linear forwards;

            filter:
                drop-shadow(
                    0 3px 6px
                    rgba(0,0,0,.5)
                );

        }


        @keyframes heartFloat {

            0% {

                transform:
                    translateY(0)
                    scale(.5);

                opacity: 0;

            }


            15% {

                opacity: 1;

                transform:
                    translateY(-30px)
                    scale(1);

            }


            80% {

                opacity: 1;

            }


            100% {

                transform:

                    translateY(-400px)
                    translateX(var(--move))
                    scale(1.3);

                opacity: 0;

            }

        }


        /* =========================================
           ROSAS E PRESENTES
        ========================================= */

        .gifts-container {

            position: absolute;

            z-index: 7;

            right: 60px;

            bottom: 10px;

            width: 130px;

            height: 70%;

            overflow: hidden;

            pointer-events: none;

        }


        .gift-animation {

            position: absolute;

            bottom: 0;

            font-size:
                clamp(25px, 3vw, 55px);

            animation:
                giftFloat
                2.8s ease-out forwards;

        }


        @keyframes giftFloat {

            0% {

                opacity: 0;

                transform:
                    translateY(0)
                    scale(.4)
                    rotate(-10deg);

            }


            20% {

                opacity: 1;

                transform:
                    translateY(-30px)
                    scale(1.2)
                    rotate(10deg);

            }


            100% {

                opacity: 0;

                transform:

                    translateY(-300px)
                    translateX(var(--gift-move))
                    scale(1.4)
                    rotate(25deg);

            }

        }


        /* =========================================
           PARTE INFERIOR
        ========================================= */

        .live-bottom {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding:
                9px 4px
                5px;

        }


        .comment-input {

            width: 40%;

            background:
                rgba(35,35,35,.95);

            padding:
                9px 15px;

            border-radius: 30px;

            color: #bdbdbd;

            font-size:
                clamp(9px, 1vw, 14px);

            cursor: text;

        }


        .actions {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap:
                clamp(10px, 1.5vw, 22px);

            flex: 1;

        }


        .action {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 2px;

            color: #ddd;

            font-size:
                clamp(7px, .75vw, 11px);

            cursor: pointer;

            transition: .2s;

            user-select: none;

        }


        .action:hover {

            transform:
                scale(1.12);

        }


        .action-icon {

            font-size:
                clamp(18px, 2vw, 30px);

        }


        .action.active {

            transform:
                scale(1.18);

        }


        /* =========================================
           BOTÃO DELAY
        ========================================= */

        #btnDelay {

            display: none;

            width:
                calc(100% - 30px);

            max-width: 1000px;

            margin:
                25px auto
                50px;

            padding:
                20px 30px;

            border: none;

            border-radius: 50px;

            background:
                var(--gold-gradient);

            color: #000;

            font-size:
                clamp(16px, 2vw, 26px);

            font-weight: 900;

            text-transform: uppercase;

            cursor: pointer;

            box-shadow:

                0 15px 40px
                rgba(212,175,55,.25);

            transition: .25s;

        }


        #btnDelay:hover {

            transform:
                scale(1.04);

        }


        /* =========================================
           ANIMAÇÃO BOTÃO
        ========================================= */

        .animate-bounce {

            animation:
                bounce
                1s infinite;

        }


        @keyframes bounce {

            0%,
            100% {

                transform:
                    translateY(0);

            }


            50% {

                transform:
                    translateY(-8px);

            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media(max-width:768px) {

            .live-container {
                padding: 0 6px;
            }


            .live-top {

                padding:
                    5px 2px
                    7px;

                gap: 6px;

            }


            .avatar-principal {

                width: 32px;
                height: 32px;

            }


            .mini-avatar {

                width: 23px;
                height: 23px;

            }


            .follow-btn {

                padding:
                    5px 8px;

                font-size: 8px;

            }


            .comments {

                left: 7px;

                bottom: 8px;

                width: 45%;

                gap: 4px;

            }


            .comment-avatar {

                min-width: 20px;

                width: 20px;
                height: 20px;

            }


            .comment-name {

                font-size: 7px;

            }


            .comment-message {

                font-size: 8px;

            }


            .ranking {

                top: 7px;
                left: 7px;

                padding:
                    4px 7px;

            }


            .explore {

                top: 7px;
                right: 7px;

                padding:
                    4px 7px;

            }


            .live-badge {

                top: 35px;
                right: 7px;

                padding: 5px 7px;

            }


            .live-bottom {

                padding-top: 6px;

            }


            .comment-input {

                width: 40%;

                padding:
                    7px 10px;

                font-size: 8px;

            }


            .actions {

                gap: 9px;

            }


            .action-icon {

                font-size: 17px;

            }


            .action {

                font-size: 7px;

            }

        }


        @media(max-width:480px) {

            .titulo-topo {

                padding:
                    12px 8px;

            }


            .titulo-topo h2 {

                font-size: 18px;

            }


            .profile-name {

                font-size: 9px;

            }


            .profile-likes {

                font-size: 7px;

            }


            .viewer-count {

                font-size: 8px;

            }


            .close-live {

                font-size: 22px;

            }


            .comments {

                width: 52%;

            }


            .action:nth-child(2) span {

                display: none;

            }

        }

    </style>

</head>

    <script>


        /* =========================================
           AVATARES DOS COMENTÁRIOS
        ========================================= */

        const avatarBase =
            "https://thispersondoesnotexist.com/";


        const comments = [

            {
                name: "joao_dias",
                message: "Grande conteúdo! 🔥🔥",
                avatar: avatarBase + "?joao1"
            },

            {
                name: "maria_luisa",
                message: "Qual é o primeiro passo?",
                avatar: avatarBase + "?maria2"
            },

            {
                name: "investidor_27",
                message: "Top demais! 💪",
                avatar: avatarBase + "?invest3"
            },

            {
                name: "sonia.moraes",
                message: "Muito bom! 👏",
                avatar: avatarBase + "?sonia4"
            },

            {
                name: "pedro_santos",
                message: "Entrei agora na LIVE 👋",
                avatar: avatarBase + "?pedro5"
            },

            {
                name: "antonio_kz",
                message: "Finalmente alguém explicando isso bem!",
                avatar: avatarBase + "?antonio6"
            },

            {
                name: "joana.angola",
                message: "Estou acompanhando desde o início 🔥",
                avatar: avatarBase + "?joana7"
            },

            {
                name: "manuel_ao",
                message: "Isso mudou minha visão!",
                avatar: avatarBase + "?manuel8"
            },

            {
                name: "carlos.invest",
                message: "Muito valor nessa LIVE 👏",
                avatar: avatarBase + "?carlos9"
            },

            {
                name: "ana_maria",
                message: "Pode explicar novamente?",
                avatar: avatarBase + "?ana10"
            },

            {
                name: "miguel.santos",
                message: "Quem está assistindo até agora? 🔥",
                avatar: avatarBase + "?miguel11"
            },

            {
                name: "lucas_ao",
                message: "Conteúdo de outro nível! 🚀",
                avatar: avatarBase + "?lucas12"
            }

        ];


        let commentIndex = 0;


        const commentsContainer =
            document.getElementById(
                "commentsContainer"
            );


        /* =========================================
           CRIAR COMENTÁRIO
        ========================================= */

        function addComment() {


            const data =
                comments[commentIndex];


            const comment =
                document.createElement("div");


            comment.className =
                "comment";


            comment.innerHTML = `

                <div class="comment-avatar">

                    <img
                        src="${data.avatar}"
                        alt="Perfil"
                    >

                </div>


                <div class="comment-body">

                    <div class="comment-name">
                        ${data.name}
                    </div>

                    <div class="comment-message">
                        ${data.message}
                    </div>

                </div>

            `;


            commentsContainer.appendChild(
                comment
            );


            /* Mantém apenas 4 comentários */

            if (
                commentsContainer.children.length > 4
            ) {

                const firstComment =
                    commentsContainer.firstElementChild;


                firstComment.classList.add(
                    "removing"
                );


                setTimeout(
                    function () {

                        firstComment.remove();

                    },
                    300
                );

            }


            commentIndex++;


            if (
                commentIndex >= comments.length
            ) {

                commentIndex = 0;

            }

        }


        setTimeout(
            addComment,
            800
        );


        setInterval(
            addComment,
            3000
        );


        /* =========================================
           ESPECTADORES
        ========================================= */

        const viewerCount =
            document.getElementById(
                "viewerCount"
            );


        let viewers = 2300;


        function updateViewers() {


            const variation =
                Math.floor(
                    Math.random() * 100
                ) - 30;


            viewers += variation;


            if (viewers < 2100) {

                viewers = 2100;

            }


            if (viewers > 4800) {

                viewers = 4800;

            }


            viewerCount.textContent =

                viewers >= 1000

                    ?

                    (viewers / 1000)
                        .toFixed(1)
                        .replace(".0", "")

                    + "K"

                    :

                    viewers;

        }


        setInterval(
            updateViewers,
            2500
        );


        /* =========================================
           CURTIDAS
        ========================================= */

        const likesCount =
            document.getElementById(
                "likesCount"
            );


        let likes = 3200;


        function updateLikes() {


            likes +=
                Math.floor(
                    Math.random() * 15
                ) + 3;


            likesCount.textContent =

                likes >= 1000

                    ?

                    (likes / 1000)
                        .toFixed(1)
                        .replace(".0", "")

                    + "K"

                    :

                    likes;

        }


        setInterval(
            updateLikes,
            4000
        );


        /* =========================================
           CORAÇÕES
        ========================================= */

        const heartsContainer =
            document.getElementById(
                "heartsContainer"
            );


        const heartEmojis = [

            "❤️",
            "💕",
            "💗",
            "💖"

        ];


        function createHeart() {


            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.textContent =

                heartEmojis[
                    Math.floor(
                        Math.random()
                        *
                        heartEmojis.length
                    )
                ];


            heart.style.left =
                Math.random() * 25
                + "px";


            heart.style.setProperty(

                "--move",

                (
                    Math.random() * 60 - 30
                ) + "px"

            );


            heartsContainer.appendChild(
                heart
            );


            setTimeout(
                function () {

                    heart.remove();

                },
                3500
            );

        }


        setInterval(
            createHeart,
            1200
        );


        /* =========================================
           ROSAS E PRESENTES
        ========================================= */

        const giftsContainer =
            document.getElementById(
                "giftsContainer"
            );


        function createGift(
            emoji
        ) {


            const gift =
                document.createElement("div");


            gift.className =
                "gift-animation";


            gift.textContent =
                emoji;


            gift.style.left =
                Math.random() * 70
                + "px";


            gift.style.setProperty(

                "--gift-move",

                (
                    Math.random() * 100 - 50
                ) + "px"

            );


            giftsContainer.appendChild(
                gift
            );


            setTimeout(
                function () {

                    gift.remove();

                },
                2800
            );

        }


        /* =========================================
           BOTÃO CURTIR
        ========================================= */

        document
            .getElementById(
                "heartAction"
            )
            .addEventListener(
                "click",
                function () {

                    createHeart();
                    createHeart();
                    createHeart();

                    likes += 10;

                }
            );


        /* =========================================
           BOTÃO ROSA
        ========================================= */

        document
            .getElementById(
                "roseAction"
            )
            .addEventListener(
                "click",
                function () {

                    createGift("🌹");

                }
            );


        /* =========================================
           BOTÃO PRESENTE
        ========================================= */

        document
            .getElementById(
                "giftAction"
            )
            .addEventListener(
                "click",
                function () {

                    createGift("🎁");

                }
            );


        /* =========================================
           BOTÃO SEGUIR
        ========================================= */

        document
            .getElementById(
                "followBtn"
            )
            .addEventListener(
                "click",
                function () {

                    this.classList.toggle(
                        "following"
                    );


                    if (
                        this.classList.contains(
                            "following"
                        )
                    ) {

                        this.textContent =
                            "✓ Seguindo";

                    }

                    else {

                        this.textContent =
                            "+ Seguir";

                    }

                }
            );


        /* =========================================
           PARTILHAR
        ========================================= */

        document
            .getElementById(
                "shareAction"
            )
            .addEventListener(
                "click",
                async function () {

                    if (
                        navigator.share
                    ) {

                        try {

                            await navigator.share({

                                title:
                                    "Sou Angolano",

                                text:
                                    "Assista esta LIVE!",

                                url:
                                    window.location.href

                            });

                        }

                        catch (error) {

                        }

                    }

                    else {

                        alert(
                            "Copie o link da página para partilhar."
                        );

                    }

                }
            );


        /* =========================================
           DELAY DO BOTÃO

           220000ms = 3min40s
        ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const botao =
                    document.getElementById(
                        "btnDelay"
                    );


                const tempoDelay =
                    220000;


                setTimeout(
                    function () {


                        botao.style.display =
                            "block";


                        botao.classList.add(
                            "animate-bounce"
                        );


                    },
                    tempoDelay
                );

            }
        );


    </script>


</body>

</html>
