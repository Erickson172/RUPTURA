<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOU ANGOLANO - Conhecimento vale Ouro</title>


    


    <!-- =========================================
         FONTES
    ========================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: "Inter", sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }


        :root {

            --pink: #ff174f;

            --gold:
                linear-gradient(
                    135deg,
                    #F8D308,
                    #D4AF37,
                    #F8D308
                );

        }


        /* =========================================
           TÍTULO
        ========================================== */

        .titulo-topo {

            width: 100%;

            text-align: center;

            padding: 25px 15px 20px;

        }


        .titulo-topo h2 {

            color: #dc2626;

            font-size:
                clamp(22px, 3vw, 52px);

            font-weight: 900;

            font-style: italic;

            text-transform: uppercase;

        }


        /* =========================================
           ESTRUTURA PRINCIPAL
        ========================================== */

        .live-container {

            width: 100%;

            display: flex;

            justify-content: center;

            padding: 0 15px 30px;

        }


        .live-wrapper {

            width: 100%;

            max-width: 1500px;

        }


        /* =========================================
           BARRA SUPERIOR
           FICA ACIMA DO VÍDEO
        ========================================== */

        .live-topbar {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px 5px 14px;

            gap: 20px;

        }


        .top-left-group {

            display: flex;

            align-items: center;

            gap: 14px;

            min-width: 0;

        }


        .avatar-principal {

            width: 58px;

            height: 58px;

            border-radius: 50%;

            overflow: hidden;

            border:
                2px solid
                rgba(255,255,255,.9);

            flex-shrink: 0;

            background: #111;

        }


        .avatar-principal img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        .profile-info {

            display: flex;

            flex-direction: column;

            gap: 3px;

            white-space: nowrap;

        }


        .profile-name {

            font-size:
                clamp(16px, 1.8vw, 29px);

            font-weight: 800;

        }


        .profile-likes {

            color: #cfcfcf;

            font-size:
                clamp(12px, 1.3vw, 20px);

        }


        /* =========================================
           BOTÃO SEGUIR
        ========================================== */

        .follow-btn {

            border: none;

            background: #ff174f;

            color: #fff;

            padding:
                13px 25px;

            border-radius: 50px;

            font-size:
                clamp(14px, 1.5vw, 22px);

            font-weight: 800;

            cursor: pointer;

            transition: .25s;

            white-space: nowrap;

        }


        .follow-btn:hover {

            transform: scale(1.05);

        }


        .follow-btn.following {

            background: #333;

            color: #ddd;

        }


        /* =========================================
           TOPO DIREITO
        ========================================== */

        .top-right-group {

            display: flex;

            align-items: center;

            gap: 18px;

        }


        .avatars-live {

            display: flex;

            align-items: center;

        }


        .mini-avatar {

            width: 45px;

            height: 45px;

            border-radius: 50%;

            overflow: hidden;

            margin-left: -10px;

            border: 2px solid #eab308;

            background: #222;

        }


        .mini-avatar:first-child {

            margin-left: 0;

        }


        .mini-avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .viewer-count {

            font-size:
                clamp(16px, 1.7vw, 26px);

            font-weight: 700;

            white-space: nowrap;

        }


        .close-live {

            font-size:
                clamp(35px, 3vw, 55px);

            font-weight: 200;

            cursor: pointer;

            line-height: 1;

        }


        /* =========================================
           VÍDEO - RETANGULAR
        ========================================== */

        .live-screen {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            background: #000;

            overflow: hidden;

            border-radius: 0;

            box-shadow:
                0 0 0 1px
                rgba(255,255,255,.08),

                0 20px 60px
                rgba(0,0,0,.8);

        }


        .video-background {

            position: absolute;

            inset: 0;

            z-index: 1;

            width: 100%;

            height: 100%;

        }


        .video-background iframe {

            width: 100%;

            height: 100%;

            border: none;

            display: block;

        }


        /* =========================================
           SOMBRA SOBRE O VÍDEO
        ========================================== */

        .live-screen::before {

            content: "";

            position: absolute;

            inset: 0;

            z-index: 2;

            pointer-events: none;

            background:

                linear-gradient(
                    180deg,
                    rgba(0,0,0,.50),
                    transparent 25%
                ),

                linear-gradient(
                    0deg,
                    rgba(0,0,0,.45),
                    transparent 28%
                ),

                linear-gradient(
                    90deg,
                    rgba(0,0,0,.35),
                    transparent 28%,
                    transparent 72%,
                    rgba(0,0,0,.15)
                );

        }


        /* =========================================
           INTERFACE INTERNA
        ========================================== */

        .live-ui {

            position: absolute;

            inset: 0;

            z-index: 3;

            pointer-events: none;

        }


        /* =========================================
           RANKING
           CANTO SUPERIOR ESQUERDO
        ========================================== */

        .ranking {

            position: absolute;

            top: 3%;

            left: 1.5%;

            background:
                rgba(0,0,0,.75);

            backdrop-filter:
                blur(15px);

            padding:
                10px 18px;

            border-radius: 50px;

            font-size:
                clamp(11px, 1.1vw, 18px);

            font-weight: 700;

        }


        /* =========================================
           EXPLORAR
           CANTO SUPERIOR DIREITO
        ========================================== */

        .explore {

            position: absolute;

            top: 3%;

            right: 1.5%;

            background:
                rgba(0,0,0,.65);

            backdrop-filter:
                blur(15px);

            padding:
                10px 18px;

            border-radius: 50px;

            font-size:
                clamp(11px, 1.1vw, 18px);

            font-weight: 700;

        }


        /* =========================================
           LIVE BADGE
           SUPERIOR DIREITO
        ========================================== */

        .live-badge {

            position: absolute;

            top: 14%;

            right: 1.5%;

            display: flex;

            align-items: center;

            gap: 15px;

            padding:
                14px 20px;

            background:
                rgba(8,8,12,.88);

            backdrop-filter:
                blur(20px);

            border-radius: 15px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.5);

        }


        .live-text {

            display: flex;

            flex-direction: column;

            gap: 4px;

        }


        .live-text strong {

            font-size:
                clamp(13px, 1.5vw, 23px);

        }


        .live-text span {

            color: #ddd;

            font-size:
                clamp(10px, 1.1vw, 17px);

        }


        .tiktok-symbol {

            font-size:
                clamp(28px, 3vw, 52px);

        }


        /* =========================================
           COMENTÁRIOS
           ESQUERDA DO VÍDEO
        ========================================== */

        .comments {

            position: absolute;

            left: 1.8%;

            bottom: 7%;

            width: 43%;

            max-height: 62%;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            gap: 9px;

        }


        .comment {

            display: flex;

            align-items: flex-start;

            opacity: 0;

            transform:
                translateY(20px);

            animation:
                commentAppear
                .5s ease forwards;

        }


        .comment-body {

            display: flex;

            flex-direction: column;

            gap: 3px;

        }


        .comment-name {

            color: #cfcfcf;

            font-size:
                clamp(11px, 1.15vw, 18px);

            font-weight: 600;

        }


        .comment-message {

            color: #fff;

            font-size:
                clamp(12px, 1.3vw, 21px);

            font-weight: 500;

            line-height: 1.2;

            text-shadow:
                0 2px 8px
                rgba(0,0,0,.9);

        }


        @keyframes commentAppear {

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .comment.removing {

            animation:
                commentRemove
                .4s ease forwards;

        }


        @keyframes commentRemove {

            to {

                opacity: 0;

                transform:
                    translateX(-30px);

            }

        }


        /* =========================================
           BARRA LATERAL DIREITA
        ========================================== */

        .right-actions {

            position: absolute;

            right: 1.5%;

            top: 42%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 15px;

        }


        .side-action {

            width: 58px;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(0,0,0,.35);

            backdrop-filter:
                blur(10px);

            font-size:
                clamp(25px, 2.5vw, 42px);

            cursor: pointer;

            pointer-events: auto;

            transition: .2s;

        }


        .side-action:hover {

            transform:
                scale(1.12);

        }


        /* =========================================
           CORAÇÕES
        ========================================== */

        .hearts-container {

            position: absolute;

            right: 1.5%;

            bottom: 5%;

            width: 100px;

            height: 65%;

            overflow: hidden;

            pointer-events: none;

        }


        .heart {

            position: absolute;

            bottom: 0;

            font-size:
                clamp(25px, 3vw, 55px);

            animation:
                heartFloat
                4s linear forwards;

            filter:
                drop-shadow(
                    0 5px 10px
                    rgba(0,0,0,.5)
                );

        }


        @keyframes heartFloat {

            0% {

                transform:
                    translateY(0)
                    scale(.5);

                opacity: 0;

            }


            15% {

                opacity: 1;

            }


            100% {

                transform:
                    translateY(-500px)
                    translateX(var(--move))
                    scale(1.4);

                opacity: 0;

            }

        }


        /* =========================================
           BARRA INFERIOR
           FICA ABAIXO DO VÍDEO
        ========================================== */

        .live-bottom-bar {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            padding: 16px 5px 5px;

        }


        .comment-input {

            width: 58%;

            border: none;

            outline: none;

            background:
                linear-gradient(
                    90deg,
                    #252525,
                    #161616
                );

            color: #fff;

            padding:
                18px 25px;

            border-radius: 50px;

            font-size:
                clamp(14px, 1.4vw, 22px);

        }


        .comment-input::placeholder {

            color: #aaa;

        }


        .bottom-actions {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap:
                clamp(15px, 3vw, 50px);

            flex: 1;

        }


        .bottom-action {

            border: none;

            background: transparent;

            color: #ddd;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 5px;

            cursor: pointer;

            font-family: inherit;

            transition: .2s;

        }


        .bottom-action:hover {

            transform:
                translateY(-4px);

        }


        .bottom-icon {

            font-size:
                clamp(28px, 3vw, 45px);

            line-height: 1;

        }


        .bottom-action span {

            font-size:
                clamp(10px, 1vw, 16px);

        }


        /* =========================================
           BOTÃO DELAY
        ========================================== */

        #btnDelay {

            display: none;

            width:
                calc(100% - 30px);

            max-width: 1000px;

            margin:
                35px auto
                50px;

            padding:
                22px 30px;

            border: none;

            border-radius: 50px;

            background:
                var(--gold);

            color: #000;

            font-size:
                clamp(17px, 2vw, 27px);

            font-weight: 900;

            text-transform: uppercase;

            cursor: pointer;

            box-shadow:
                0 15px 40px
                rgba(212,175,55,.25);

        }


        .animate-bounce {

            animation:
                bounce
                1s infinite;

        }


        @keyframes bounce {

            0%,
            100% {

                transform:
                    translateY(0);

            }


            50% {

                transform:
                    translateY(-10px);

            }

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media(max-width: 900px) {

            .live-topbar {

                gap: 10px;

            }


            .top-right-group {

                gap: 10px;

            }


            .mini-avatar {

                width: 34px;

                height: 34px;

            }


            .avatar-principal {

                width: 46px;

                height: 46px;

            }


            .follow-btn {

                padding:
                    10px 16px;

            }


            .comments {

                width: 50%;

            }


            .right-actions {

                gap: 8px;

            }


            .side-action {

                width: 44px;

                height: 44px;

            }

        }


        @media(max-width: 650px) {

            .live-container {

                padding:
                    0 5px 20px;

            }


            .live-topbar {

                padding:
                    8px 3px 10px;

            }


            .profile-name {

                font-size: 13px;

            }


            .profile-likes {

                font-size: 10px;

            }


            .avatar-principal {

                width: 34px;

                height: 34px;

            }


            .follow-btn {

                padding:
                    8px 11px;

                font-size: 11px;

            }


            .mini-avatar {

                width: 24px;

                height: 24px;

                margin-left: -6px;

            }


            .viewer-count {

                font-size: 13px;

            }


            .close-live {

                font-size: 32px;

            }


            .ranking,
            .explore {

                padding:
                    6px 10px;

                font-size: 9px;

            }


            .live-badge {

                top: 15%;

                padding:
                    7px 9px;

                gap: 6px;

            }


            .live-text strong {

                font-size: 9px;

            }


            .live-text span {

                font-size: 7px;

            }


            .tiktok-symbol {

                font-size: 23px;

            }


            .comments {

                left: 2%;

                width: 56%;

                bottom: 5%;

                gap: 5px;

            }


            .comment-name {

                font-size: 8px;

            }


            .comment-message {

                font-size: 9px;

            }


            .right-actions {

                right: 1%;

                top: 42%;

                gap: 5px;

            }


            .side-action {

                width: 30px;

                height: 30px;

                font-size: 18px;

            }


            .live-bottom-bar {

                gap: 8px;

                padding-top: 10px;

            }


            .comment-input {

                width: 48%;

                padding:
                    11px 13px;

                font-size: 10px;

            }


            .bottom-actions {

                gap: 10px;

            }


            .bottom-icon {

                font-size: 22px;

            }


            .bottom-action span {

                font-size: 7px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         TÍTULO
    ========================================== -->

    <div class="titulo-topo">

        <h2>
            ASSISTA ANTES DE CONTINUAR!
        </h2>

    </div>



    <!-- =========================================
         CONTAINER PRINCIPAL
    ========================================== -->

    <div class="live-container">

        <div class="live-wrapper">



            <!-- =========================================

            ========================================== -->

            <div class="live-topbar">


                <div class="top-left-group">


                    <!-- LOGO PRINCIPAL -->

                    <div class="avatar-principal">

                        <img
                            src="logo-sou-angolano.png"
                            alt="Sou Angolano"

                    </div>


                    <!-- NOME -->

                    <div class="profile-info">

                        <div class="profile-name">
                            Sou Angolano
                        </div>

                        <div class="profile-likes">
                            ❤ <span id="likesCount">3.2K</span> curtidas
                        </div>

                    </div>


                    <!-- SEGUIR -->

                    <button

                        id="followBtn"
                    >

                    </button>


                </div>



                <!-- TOPO DIREITO -->

                <div class="top-right-group">

                    <div class="avatars-live">

            </div>



            <!-- =========================================

            ========================================== -->

            <div class="live-screen">


                <!-- VÍDEO -->

                <div class="video-background">

                    <iframe
                        id="panda-4096f280-4088-4fbf-b9de-9c3f23332beb"
                        src="https://player-vz-abc8d156-dd5.tv.pandavideo.com.br/embed/?v=4096f280-4088-4fbf-b9de-9c3f23332beb"

                    <!-- COMENTÁRIOS -->

                    </div>



                    <!-- AÇÕES LATERAIS -->

                    <div class="right-actions">

                        <button
                            class="side-action"
                            id="heartButton"
                            title="Curtir">

                            ❤️

                        </button>


                        <button
                            class="side-action"
                            title="Curtir">

                            💕
                        </button>


                        <button
                            class="side-action"
                            id="sideShareButton"
                            title="Partilhar">

                            ↗

                        </button>


                        <button
                            class="side-action"
                            title="Mais reações">

                            💗

                        </button>

                    </div>



                    <!-- CORAÇÕES FLUTUANTES -->

                    <div
                        id="heartsContainer"
                        class="hearts-container">
                    </div>


                </div>

            </div>



            <!-- =========================================
                 BARRA INFERIOR - ABAIXO DO VÍDEO
            ========================================== -->

            <div class="live-bottom-bar">


                <input
                    type="text"
                    class="comment-input"
                    placeholder="Adicionar comentário..."
                >



                <div class="bottom-actions">


                    <button class="bottom-action">

                        <div class="bottom-icon">
                            👥
                        </div>

                        <span>
                            Vários
                        </span>

                    </button>



                    <button
                        class="bottom-action"
                        id="roseButton">

                        <div class="bottom-icon">
                            🌹
                        </div>

                        <span>
                            Rosa
                        </span>

                    </button>



                    <button
                        class="bottom-action"
                        id="giftButton">

                        <div class="bottom-icon">
                            🎁
                        </div>

                        <span>
                            Presente
                        </span>

                    </button>



                    <button
                        class="bottom-action"
                        id="shareButton">

                        <div class="bottom-icon">
                            ↗
                        </div>

                        <span>
                            Partilhar
                        </span>

                    </button>



                    <button class="bottom-action">

                        <div class="bottom-icon">
                            •••
                        </div>

                        <span>
                            Mais
                        </span>

                    </button>


                </div>


            </div>


        </div>

    </div>



    <!-- =========================================
         BOTÃO DELAY
    ========================================== -->

    <button
        id="btnDelay"
        onclick="window.location.href='payment.html'">

        VERIFICAR CONTA AGORA

    </button>



    <script>


        /* =========================================
           COMENTÁRIOS
        ========================================== */

        const comments = [

            {
                name: "joao_dias",
                message: "Grande conteúdo! 🔥🔥"
            },

            {
                name: "maria_luisa",
                message: "Qual é o primeiro passo?"

            {

            },

            {

            },

            {

            },

            {

                message: "Finalmente alguém explicando isso bem!"
            },

            {

                message: "Estou acompanhando desde o início 🔥"
            },

            {
                name: "manuel_ao",
                message: "Isso mudou minha visão completamente!"
            },

            {
                name: "carlos.invest",
                message: "Muito valor nessa LIVE 👏"
            },

            {
                name: "ana_maria",
                message: "Pode explicar novamente essa parte?"
            },

            {
                name: "miguel.santos",
                message: "Quem está assistindo até agora? 🔥"
            },

            {
                name: "lucas_ao",
                message: "Conteúdo de outro nível! 🚀"
            },

            {
                name: "paulo_mendes",
                message: "Estou aprendendo muito aqui!"
            },

            {
                name: "fernanda_kz",
                message: "Melhor LIVE que assisti hoje ❤️"
            },

            {
                name: "ricardo_27",
                message: "Partilhei com meus amigos! 🔥"
            }

        ];


        let commentIndex = 0;


        const commentsContainer =
            document.getElementById(
                "commentsContainer"
            );


        function addComment() {


            const data =
                comments[commentIndex];


            const comment =
                document.createElement("div");


            comment.className =
                "comment";


            comment.innerHTML = `

                <div class="comment-body">

                    <div class="comment-name">

                        ${data.name}

                    </div>

                    <div class="comment-message">

                        ${data.message}

                    </div>

                </div>

            `;


            commentsContainer.appendChild(
                comment
            );


            if (
                commentsContainer.children.length > 5
            ) {

                const firstComment =
                    commentsContainer.firstElementChild;


                firstComment.classList.add(
                    "removing"
                );


                setTimeout(function() {

                    firstComment.remove();

                }, 400);

            }


            commentIndex++;


            if (
                commentIndex >= comments.length
            ) {

                commentIndex = 0;

            }

        }


        setTimeout(
            addComment,
            1000
        );


        setInterval(
            addComment,
            3500
        );



        /* =========================================
           SEGUIR
        ========================================== */

        const followBtn =
            document.getElementById(
                "followBtn"
            );


        followBtn.addEventListener(
            "click",
            function() {

                if (
                    this.classList.contains(
                        "following"
                    )
                ) {

                    this.classList.remove(
                        "following"
                    );

                    this.textContent =
                        "+ Seguir";

                } else {

                    this.classList.add(
                        "following"
                    );

                    this.textContent =
                        "✓ Seguindo";

                }

            }
        );



        /* =========================================
           ESPECTADORES
        ========================================== */

        const viewerCount =
            document.getElementById(
                "viewerCount"
            );


        let viewers = 2300;


        function updateViewers() {

            const variation =
                Math.floor(
                    Math.random() * 180
                ) - 60;


            viewers += variation;


            if (viewers < 2100) {

                viewers = 2100;

            }


            if (viewers > 4800) {

                viewers = 4800;

            }


            viewerCount.textContent =

                viewers >= 1000

                    ?

                    (viewers / 1000)
                    .toFixed(1)
                    .replace(".0", "")

                    + "K"

                    :

                    viewers;

        }


        setInterval(
            updateViewers,
            2500
        );



        /* =========================================
           CURTIDAS
        ========================================== */

        const likesCount =
            document.getElementById(
                "likesCount"
            );


        let likes = 3200;


        function updateLikes() {

            likes +=
                Math.floor(
                    Math.random() * 25
                ) + 5;


            likesCount.textContent =

                likes >= 1000

                    ?

                    (likes / 1000)
                    .toFixed(1)
                    .replace(".0", "")

                    + "K"

                    :

                    likes;

        }


        setInterval(
            updateLikes,
            4000
        );



        /* =========================================
           CORAÇÕES
        ========================================== */

        const heartsContainer =
            document.getElementById(
                "heartsContainer"
            );


        const heartEmojis = [

            "❤️",
            "💕",
            "💗",
            "💖",
            "❤️"

        ];


        function createHeart() {


            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.textContent =

                heartEmojis[
                    Math.floor(
                        Math.random()
                        *
                        heartEmojis.length
                    )
                ];


            const randomLeft =
                Math.random() * 50;


            const randomMove =
                (
                    Math.random() * 100
                    - 50
                )
                + "px";


            heart.style.left =
                randomLeft + "px";


            heart.style.setProperty(
                "--move",
                randomMove
            );


            heartsContainer.appendChild(
                heart
            );


            setTimeout(function() {

                heart.remove();

            }, 4000);

        }


        setInterval(
            createHeart,
            900
        );


        document
        .getElementById("heartButton")
        .addEventListener(
            "click",
            function() {

                createHeart();

                createHeart();

                createHeart();

            }
        );



        /* =========================================
           ROSA
        ========================================== */

        document
        .getElementById("roseButton")
        .addEventListener(
            "click",
            function() {

                for (
                    let i = 0;
                    i < 5;
                    i++
                ) {

                    setTimeout(
                        createRose,
                        i * 150
                    );

                }

            }
        );


        function createRose() {


            const rose =
                document.createElement("div");


            rose.className =
                "heart";


            rose.textContent =
                "🌹";


            rose.style.left =
                Math.random() * 50
                + "px";


            rose.style.setProperty(
                "--move",
                (
                    Math.random() * 100
                    - 50
                )
                + "px"
            );


            heartsContainer.appendChild(
                rose
            );


            setTimeout(function() {

                rose.remove();

            }, 4000);

        }



        /* =========================================
           PRESENTE
        ========================================== */

        document
        .getElementById("giftButton")
        .addEventListener(
            "click",
            function() {

                const gift =
                    document.createElement("div");


                gift.className =
                    "heart";


                gift.textContent =
                    "🎁";


                gift.style.left =
                    "20px";


                gift.style.setProperty(
                    "--move",
                    "30px"
                );


                heartsContainer.appendChild(
                    gift
                );


                setTimeout(function() {

                    gift.remove();

                }, 4000);

            }
        );



        /* =========================================
           PARTILHAR
        ========================================== */

        async function shareLive() {

            if (
                navigator.share
            ) {

                try {

                    await navigator.share({

                        title:
                            "Sou Angolano - LIVE",

                        text:
                            "Assista esta LIVE!",

                        url:
                            window.location.href

                    });

                } catch (error) {

                    console.log(
                        "Partilha cancelada"
                    );

                }

            } else {

                alert(
                    "Copie o link da página para partilhar."
                );

            }

        }


        document
        .getElementById("shareButton")
        .addEventListener(
            "click",
            shareLive
        );


        document
        .getElementById("sideShareButton")
        .addEventListener(
            "click",
            shareLive
        );



        /* =========================================
           DELAY DO BOTÃO

           220000ms = 3 MINUTOS E 40 SEGUNDOS
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                const botao =
                    document.getElementById(
                        "btnDelay"
                    );


                const tempoDelay =
                    220000;


                setTimeout(
                    function() {

                        botao.style.display =
                            "block";


                        botao.classList.add(
                            "animate-bounce"
                        );

                    },
                    tempoDelay
                );

            }
        );


    </script>


</body>
</html>
