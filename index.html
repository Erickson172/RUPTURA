@keyframes commentAppear{

.comment.removing{

/* =========================================

========================================= */

.hearts-container{

.heart{

    position:absolute;

    bottom:0;

    font-size:
    clamp(25px,3vw,55px);

    animation:
    heartFloat
    4s linear forwards;

    filter:

    drop-shadow(

}

@keyframes heartFloat{

    0%{

        transform:

        translateY(0)
        scale(.5)
        rotate(0deg);

        opacity:0;

    }

    15%{

        opacity:1;

        transform:

        translateY(-40px)
        scale(1)

    }

    80%{

    100%{

        transform:

        translateY(-500px)
        translateX(

        scale(1.4)
        rotate(20deg);

        opacity:0;

}

/* =========================================

.animate-bounce{

<script>


/* =========================================
   LISTA DE COMENTÁRIOS
========================================= */

const comments = [

    {
        name:"joao_dias",
        message:"Grande conteúdo! 🔥🔥"
    },

    {
        name:"maria_luisa",
        message:"Qual é o primeiro passo?"
    },

    {
        name:"investidor_27",
        message:"Top demais! 💪"
    },

    {
        name:"sonia.moraes",
        message:"Já apliquei e já tive resultado! ✅"
    },

    {
        name:"pedro_santos",
        message:"Entrei agora na LIVE 👋"
    },

    {
        name:"antonio_kz",
        message:"Finalmente alguém explicando isso bem!"
    },

    {
        name:"joana.angola",
        message:"Estou acompanhando desde o início 🔥"
    },

    {
        name:"manuel_ao",
        message:"Isso mudou minha visão completamente!"
    },

    {
        name:"carlos.invest",
        message:"Muito valor nessa LIVE 👏"
    },

    {
        name:"ana_maria",
        message:"Pode explicar novamente essa parte?"
    },

    {
        name:"miguel.santos",
        message:"Quem está assistindo até agora? 🔥"
    },

    {
        name:"lucas_ao",
        message:"Conteúdo de outro nível! 🚀"
    },

    {
        name:"paulo_mendes",
        message:"Estou aprendendo muito aqui!"
    },

    {
        name:"fernanda_kz",
        message:"Melhor LIVE que assisti hoje ❤️"
    },

    {
        name:"ricardo_27",
        message:"Partilhei com meus amigos! 🔥"
    }

];


let commentIndex = 0;

const commentsContainer =
document.getElementById(
    "commentsContainer"
);


/* =========================================
   CRIAR COMENTÁRIO
========================================= */

function addComment(){

    const data =
    comments[commentIndex];


    const comment =
    document.createElement("div");

    comment.className =
    "comment";


    const initials =
    data.name
    .substring(0,2)
    .toUpperCase();


    comment.innerHTML = `

        <div class="comment-avatar">

            ${initials}

        </div>


        <div class="comment-body">

            <div class="comment-name">

                ${data.name}

            </div>


            <div class="comment-message">

                ${data.message}

            </div>

        </div>

    `;


    commentsContainer.appendChild(
        comment
    );


    /* Mantém apenas 5 comentários */

    if(
        commentsContainer.children.length > 5
    ){

        const firstComment =
        commentsContainer.firstElementChild;


        firstComment.classList.add(
            "removing"
        );


        setTimeout(function(){

            firstComment.remove();

        },400);

    }


    commentIndex++;


    if(
        commentIndex >= comments.length
    ){

        commentIndex = 0;

    }

}


/* Primeiro comentário */

setTimeout(
    addComment,
    1000
);


/* Novo comentário a cada poucos segundos */

setInterval(
    addComment,
    3500
);



/* =========================================
   CONTADOR DE ESPECTADORES
========================================= */

const viewerCount =
document.getElementById(
    "viewerCount"
);


let viewers = 2300;


function updateViewers(){

    const variation =
    Math.floor(
        Math.random() * 180
    ) - 60;


    viewers += variation;


    /* Limite mínimo */

    if(viewers < 2100){

        viewers = 2100;

    }


    /* Limite máximo */

    if(viewers > 4800){

        viewers = 4800;

    }


    viewerCount.textContent =

    viewers >= 1000

    ?

    (viewers / 1000)
    .toFixed(1)
    .replace(".0","")

    + "K"

    :

    viewers;

}


setInterval(
    updateViewers,
    2500
);



/* =========================================
   CURTIDAS DINÂMICAS
========================================= */

const likesCount =
document.getElementById(
    "likesCount"
);


let likes = 3200;


function updateLikes(){

    likes +=
    Math.floor(
        Math.random() * 25
    ) + 5;


    likesCount.textContent =

    likes >= 1000

    ?

    (likes / 1000)
    .toFixed(1)
    .replace(".0","")

    + "K"

    :

    likes;

}


setInterval(
    updateLikes,
    4000
);



/* =========================================
   CORAÇÕES SUBINDO
========================================= */

const heartsContainer =
document.getElementById(
    "heartsContainer"
);


const heartEmojis = [

    "❤️",
    "💕",
    "💗",
    "❤️",
    "💖"

];


function createHeart(){


    const heart =
    document.createElement("div");


    heart.className =
    "heart";


    heart.textContent =

    heartEmojis[
        Math.floor(
            Math.random()
            *
            heartEmojis.length
        )
    ];


    const randomLeft =

    Math.random() * 50;


    const randomMove =

    (Math.random() * 100 - 50)
    + "px";


    heart.style.left =
    randomLeft + "px";


    heart.style.setProperty(
        "--move",
        randomMove
    );


    heartsContainer.appendChild(
        heart
    );


    setTimeout(function(){

        heart.remove();

    },4000);


}


setInterval(
    createHeart,
    850
);



/* =========================================
   DELAY DO BOTÃO
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        const botao =
        document.getElementById(
            "btnDelay"
        );


        const tempoDelay =
        220000;


        setTimeout(
            function(){

                botao.style.display =
                "block";


                botao.classList.add(
                    "animate-bounce"
                );

            },
            tempoDelay
        );

    }
);


</script>
