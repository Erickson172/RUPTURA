                display: none;

                message: "Partilhei com meus amigos! 🔥",
                avatar: "https://api.dicebear.com/9.x/personas/svg?seed=Ricardo27"
            }

        ];


        let commentIndex = 0;


        const commentsContainer =
            document.getElementById(
                "commentsContainer"
            );



        /* =========================================
           CRIAR COMENTÁRIO
        ========================================= */

        function addComment() {

            const data =
                comments[commentIndex];


            const comment =
                document.createElement("div");


            comment.className =
                "comment";


            comment.innerHTML = `

                <div class="comment-avatar">

                    <img
                        src="${data.avatar}"
                        alt="${data.name}"
                    >

                </div>


                <div class="comment-body">

                    <div class="comment-name">
                        ${data.name}
                    </div>


                    <div class="comment-message">
                        ${data.message}
                    </div>

                </div>

            `;


            commentsContainer.appendChild(
                comment
            );



            /* Mantém apenas 5 comentários */

            if (
                commentsContainer.children.length > 5
            ) {

                const firstComment =
                    commentsContainer.firstElementChild;


                firstComment.classList.add(
                    "removing"
                );


                setTimeout(function () {

                    firstComment.remove();

                }, 400);

            }


            commentIndex++;


            if (
                commentIndex >= comments.length
            ) {

                commentIndex = 0;

            }

        }



        /* Primeiro comentário */

        setTimeout(
            addComment,
            1000
        );



        /* Novo comentário */

        setInterval(
            addComment,
            3500
        );



        /* =========================================
           CONTADOR DE ESPECTADORES
        ========================================= */

        const viewerCount =
            document.getElementById(
                "viewerCount"
            );


        let viewers = 2300;


        function updateViewers() {

            const variation =
                Math.floor(
                    Math.random() * 180
                ) - 60;


            viewers += variation;


            if (viewers < 2100) {

                viewers = 2100;

            }


            if (viewers > 4800) {

                viewers = 4800;

            }


            viewerCount.textContent =

                viewers >= 1000

                    ?

                    (viewers / 1000)
                        .toFixed(1)
                        .replace(".0", "")

                    + "K"

                    :

                    viewers;

        }


        setInterval(
            updateViewers,
            2500
        );



        /* =========================================
           CURTIDAS DINÂMICAS
        ========================================= */

        const likesCount =
            document.getElementById(
                "likesCount"
            );


        let likes = 3200;


        function updateLikes() {

            likes +=
                Math.floor(
                    Math.random() * 25
                ) + 5;


            likesCount.textContent =

                likes >= 1000

                    ?

                    (likes / 1000)
                        .toFixed(1)
                        .replace(".0", "")

                    + "K"

                    :

                    likes;

        }


        setInterval(
            updateLikes,
            4000
        );



        /* =========================================
           CORAÇÕES SUBINDO
        ========================================= */

        const heartsContainer =
            document.getElementById(
                "heartsContainer"
            );


        const heartEmojis = [

            "❤️",
            "💕",
            "💗",
            "❤️",
            "💖"

        ];


        function createHeart() {


            const heart =
                document.createElement("div");


            heart.className =
                "heart";


            heart.textContent =

                heartEmojis[
                    Math.floor(
                        Math.random()
                        *
                        heartEmojis.length
                    )
                ];


            const randomLeft =
                Math.random() * 50;


            const randomMove =
                (Math.random() * 100 - 50)
                + "px";


            heart.style.left =
                randomLeft + "px";


            heart.style.setProperty(
                "--move",
                randomMove
            );


            heartsContainer.appendChild(
                heart
            );


            setTimeout(function () {

                heart.remove();

            }, 4000);

        }


        setInterval(
            createHeart,
            850
        );



        /* =========================================
           DELAY DO BOTÃO
        ========================================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const botao =
                    document.getElementById(
                        "btnDelay"
                    );


                const tempoDelay =
                    220000;


                setTimeout(
                    function () {

                        botao.style.display =
                            "block";


                        botao.classList.add(
                            "animate-bounce"
                        );

                    },
                    tempoDelay
                );

            }
        );


    </script>


</body>

</html>
